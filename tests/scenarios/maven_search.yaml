scenarios:
  - id: class-search-project-classpath
    title: Search for a class on the project classpath
    description: The search finds matches only in JARs on the explicit project's effective classpath.
    tool: search_classes
    arguments:
      query: Foo
    expect:
      result_count: 1
      contains:
        - class_name: org.example.Foo
          jar:
            coordinate: org.libs:helper:2.0

  - id: class-search-no-global-repository-leak
    title: Exclude global repository matches
    description: The demo artifact of the old fixture repository is not on the project classpath, so it is not visible.
    tool: search_jars
    arguments:
      query: demo
    expect:
      result_count: 0
      equals:
        results: []

  - id: jar-search-scoped-helper
    title: Search for the scoped helper JAR
    description: Both the binary and the sibling sources JAR appear in the project's scoped index.
    tool: search_jars
    arguments:
      query: helper:2.0
    expect:
      result_count: 2
      contains:
        - coordinate: org.libs:helper:2.0
          class_count: 2
        - coordinate: org.libs:helper:2.0:sources
          classifier: sources

  - id: paginated-scoped-class-list
    title: Class list of a scoped JAR
    description: Offset and limit page only the returned class list; the total stays complete.
    tool: list_jar_classes
    arguments:
      jar: org.libs:helper:2.0
      offset: 1
      limit: 1
    expect:
      result_count: 1
      contains:
        - total: 2
          offset: 1
          classes:
            - org.libs.ScopedOnly

  - id: source-from-scoped-sibling
    title: Source from a scoped sources JAR
    description: Returns source from the sibling sources JAR installed next to the classpath binary JAR.
    tool: get_class_source
    arguments:
      class_name: org.example.Foo
      version: "2.0"
    expect:
      result_count: 1
      contains:
        - class_name: org.example.Foo
          source_jar:
            coordinate: org.libs:helper:2.0:sources
          entry: org/example/Foo.java
          source: "package org.example; public class Foo { int scoped = 2; }"
          truncated: false

  - id: artifact-versions-scoped
    title: Available versions of a scoped artifact
    description: Only the helper version present in the project classpath index is visible.
    tool: list_artifact_versions
    arguments:
      group_id: org.libs
      artifact_id: helper
    expect:
      equals:
        org.libs:helper:
          - "2.0"

  - id: scoped-pom-descriptor
    title: POM descriptor of a scoped artifact
    description: The POM of the local artifact with exact coordinates can be read without a classpath index.
    tool: get_artifact_pom
    arguments:
      coordinate: org.libs:helper:2.0
    expect:
      matches:
        coordinate: org.libs:helper:2.0
        found: true
        descriptor:
          packaging: jar

  - id: scoped-type-hierarchy
    title: Search the scoped class hierarchy
    description: The classfile superclass relationship can be searched in the scoped helper artifact.
    tool: search_type_hierarchy
    arguments:
      type_name: java.lang.Object
      jar: helper-2.0.jar
    expect:
      result_count: 2
      contains:
        - type_name: org.example.Foo
          relation: extends
          depth: 1
          path:
            - java.lang.Object
            - org.example.Foo

  - id: scoped-source-regex-search
    title: Regex search in a scoped sources artifact
    description: Java source can be searched with a regex, with line numbers and bounded context.
    tool: search_source
    arguments:
      query: scoped\s*=\s*2
      regex: true
      jar: helper-2.0-sources.jar
      context_lines: 1
    expect:
      result_count: 1
      contains:
        - entry: org/example/Foo.java
          line: 1
          truncated: false

  - id: scoped-classfile-description-without-sources
    title: Class description without a sources JAR
    description: The binary artifact can be inspected from the classfile even without a source package.
    tool: describe_class
    arguments:
      class_name: org.libs.ScopedOnly
      jar: helper-2.0.jar
      visibility: public
    expect:
      result_count: 1
      contains:
        - class_name: org.libs.ScopedOnly
          visibility: public
          jar:
            coordinate: org.libs:helper:2.0

  - id: scoped-exact-service-entry
    title: Read an exact service entry
    description: The service descriptor of a selected JAR can be read as text content.
    tool: get_jar_entry
    arguments:
      jar: resource-fixture-1.0.jar
      entry: META-INF/services/org.example.Service
    expect:
      result_count: 1
      contains:
        - entry: META-INF/services/org.example.Service
          content_kind: text
          text: "org.example.Provider\n"
          truncated: false

  - id: scoped-artifact-health-diagnostics
    title: Diagnose an artifact's state
    description: The checksum and repository markers of the local artifact are visible without writing.
    tool: diagnose_artifact
    arguments:
      coordinate: org.libs:resource-fixture:1.0
    expect:
      matches:
        coordinate: org.libs:resource-fixture:1.0
        found: true
        snapshot: false

  - id: scoped-class-member-search
    title: Search for a class member
    description: Searching classfile field names works with a JAR filter and a result limit.
    tool: search_class_members
    arguments:
      query: value
      jar: helper-2.0.jar
      limit: 1
    expect:
      result_count: 1
      contains:
        - class_name: org.example.Foo
          kind: field
          name: value
          signature: I
          jar:
            coordinate: org.libs:helper:2.0

  - id: scoped-artifact-api-comparison
    title: API diff of two local artifact versions
    description: The classes added and removed between the local versions appear in structured form.
    tool: compare_artifact_api
    arguments:
      group_id: org.libs
      artifact_id: api-fixture
      previous_version: "1.0"
      current_version: "2.0"
    expect:
      matches:
        group_id: org.libs
        artifact_id: api-fixture
        previous_version: "1.0"
        current_version: "2.0"
        added_classes:
          - org.example.api.CurrentApi
        removed_classes:
          - org.example.api.LegacyApi

  - id: scoped-jar-resource-content-search
    title: Content search in a JAR resource
    description: The supported text properties entry can be searched with bounded context.
    tool: search_jar_content
    arguments:
      query: feature.provider
      jar: resource-fixture-1.0.jar
    expect:
      result_count: 1
      contains:
        - entry: config/inspection.properties
          line: 1
          jar:
            coordinate: org.libs:resource-fixture:1.0

  - id: scoped-outbound-class-reference-search
    title: Search for an outbound classfile reference
    description: The classfile's superclass reference can be found by the target class.
    tool: search_class_references
    arguments:
      class_name: org.example.Foo
      direction: outbound
      kind: class
      jar: helper-2.0.jar
    expect:
      contains:
        - target_owner: java.lang.Object
          kind: class

  - id: scoped-service-provider-search
    title: Discover a ServiceLoader provider
    description: From the META-INF/services declaration, the service and the provider appear as separate fields.
    tool: search_providers
    arguments:
      service: org.example.Service
      provider: org.example.Provider
      jar: resource-fixture-1.0.jar
    expect:
      result_count: 1
      contains:
        - service: org.example.Service
          provider: org.example.Provider
          entry: META-INF/services/org.example.Service

  - id: scoped-source-declaration-lookup
    title: Query a source class declaration
    description: The public declaration of a source class can be retrieved as a short source fragment.
    tool: get_declaration_source
    arguments:
      class_name: org.example.Foo
    expect:
      result_count: 1
      contains:
        - class_name: org.example.Foo
          kind: class
          name: org.example.Foo
          entry: org/example/Foo.java
