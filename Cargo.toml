[package]
name = "maven-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
default-run = "maven-mcp"
description = "MCP server for indexing and querying a local Maven repository"
license = "MIT"
repository = "https://github.com/tyutyutyu/maven-mcp"
homepage = "https://github.com/tyutyutyu/maven-mcp"
documentation = "https://github.com/tyutyutyu/maven-mcp/blob/main/README.md"
readme = "README.md"
keywords = ["mcp", "maven", "java", "stdio", "agent"]
categories = ["development-tools", "command-line-utilities"]
# The crates.io package is an allowlist of public sources and documents; scripts/release.sh
# check also rejects private workspace data, test logs/eval output and credential files.
include = ["/src/**/*.rs", "/Cargo.lock", "/LICENSE", "/README.md", "/CHANGELOG.md"]

[dependencies]
anyhow = "=1.0.104"
cafebabe = "=0.9.0"
flate2 = { version = "=1.1.9", default-features = false, features = ["zlib-rs"] }
clap = { version = "=4.6.7", features = ["derive"] }
nix = { version = "=0.31.3", features = ["signal"] }
rmcp = { version = "=3.8.0", features = ["client", "transport-child-process", "transport-io"] }
rayon = "=1.12.0"
quick-xml = { version = "=0.42.0", features = ["serialize"] }
regex = "=1.13.1"
schemars = "=1.2.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
rusqlite = { version = "=0.41.0", features = ["bundled"] }
tokio = { version = "=1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "=0.7.20"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
walkdir = "=2.5.0"
zip = { version = "=9.1.2", default-features = false, features = ["deflate"] }

[dev-dependencies]
insta = { version = "=1.49.0", features = ["json"] }
rmcp = { version = "=3.8.0", features = ["client", "transport-child-process", "transport-io"] }
serde_yaml_ng = "=0.10.0"
tempfile = "=3.27.0"

[profile.release]
lto = "thin"
strip = true
