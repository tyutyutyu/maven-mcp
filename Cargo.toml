[package]
name = "maven-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
default-run = "maven-mcp"
description = "MCP server for indexing and querying a local Maven repository"
license = "MIT"

[dependencies]
anyhow = "1.0"
cafebabe = "0.9"
clap = { version = "4.6.4", features = ["derive"] }
nix = { version = "0.31.3", features = ["signal"] }
rmcp = { version = "3.1.1", features = ["client", "transport-child-process", "transport-io"] }
rayon = "1.11"
quick-xml = { version = "0.41", features = ["serialize"] }
regex = "1.12"
schemars = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.39.0", features = ["bundled"] }
tokio = { version = "1.47", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2.5"
zip = { version = "8.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
insta = { version = "1.48", features = ["json"] }
rmcp = { version = "3.1.1", features = ["client", "transport-child-process", "transport-io"] }
serde_yaml_ng = "0.10"
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
