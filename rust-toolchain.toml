# The pinned developer and CI toolchain. The minimum supported Rust version
# (MSRV) is `rust-version` in Cargo.toml and is checked by a separate CI job.
# Renovate proposes updates; see docs/dependency-maintenance.md.
[toolchain]
channel = "1.99.1"
profile = "minimal"
components = ["clippy", "rustfmt", "llvm-tools-preview"]
