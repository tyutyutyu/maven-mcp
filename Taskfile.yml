---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

includes:
  dev:
    taskfile: ./.tasks/development.yml
  agent-log:
    taskfile: ./.tasks/business/agent-log.yml
  benchmark:
    taskfile: ./.tasks/business/benchmark.yml
  install:
    taskfile: ./.tasks/business/install.yml
  dogfood:
    taskfile: ./.tasks/business/dogfood.yml
  release:
    taskfile: ./.tasks/business/release.yml

tasks:
  default:
    silent: true
    cmds:
      - task --list
