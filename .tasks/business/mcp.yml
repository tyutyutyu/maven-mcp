---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

tasks:
  serve:
    desc: Start the Maven MCP server for a local repository
    requires:
      vars: [MAVEN_REPO_PATH]
    preconditions:
      - sh: command -v cargo
        msg: cargo is required
      - sh: test -d "{{.MAVEN_REPO_PATH}}"
        msg: MAVEN_REPO_PATH must point to an existing directory
    cmds:
      - cargo run --locked
