# cargo-deny policy. See docs/dependency-maintenance.md.
[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
unmaintained = "workspace"
# Every exception needs reason, owner and expiry in docs/dependency-maintenance.md.
ignore = []

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Unicode-3.0",
  "Zlib",
  "CC0-1.0",
  "MPL-2.0",
  "BSL-1.0",
]
exceptions = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
